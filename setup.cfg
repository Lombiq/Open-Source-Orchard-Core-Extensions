[codespell]
# In builtin the commas mustn't be followed by spaces.
builtin = clear,code,en-GB_to_en-US,informal,names,rare
check-filenames = 
count = 
# The <thead> tag is recognized as a misspelling of "thread". codespell:ignore
ignore-regex = (<thead|<\/thead>)
ignore-words-list = ShouldBe, uint
skip = *.min.*, *.ndproj, *.po, */bin/*, */node_modules/*, */obj/*, pnpm-lock.yaml, */vendors/*, */wwwroot/*
